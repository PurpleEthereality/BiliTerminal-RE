plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

int betaVer = 0

android {

    namespace 'com.RobinNotBad.BiliClient'
    compileSdk 34

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId "com.RobinNotBad.BiliClient"
        minSdk 24
        targetSdk 34
        versionCode 2609240
        versionName "26.09.24"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled true

        resConfigs 'zh'

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists()) {
                Properties pro = new Properties()
                pro.load(localProps.newDataInputStream())
                if (pro.containsKey("KEY_PATH")) {
                    storeFile project.rootProject.file(pro.getProperty("KEY_PATH", "key.jks"))
                    storePassword pro.getProperty("KEY_PASSWORD")
                    keyAlias pro.getProperty("ALIAS_NAME")
                    keyPassword pro.getProperty("ALIAS_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            buildConfigField "boolean", "LOG_DEBUG", "false"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists()) {
                Properties pro = new Properties()
                pro.load(localProps.newDataInputStream())
                if (pro.containsKey("KEY_PATH")) {
                    signingConfig signingConfigs.release
                }
            }

            zipAlignEnabled true
            crunchPngs false
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false

            zipAlignEnabled true
            crunchPngs false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn',
                '-Xinline-classes',
                '-Xjvm-default=all'
        ]
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/*.version'
            excludes += '/kotlin/**'
            excludes += '/DebugProbesKt.bin'
            excludes += '/okhttp3/internal/publicsuffix/*'
            excludes += '/META-INF/maven/**'
            excludes += '/META-INF/proguard/**'
            excludes += '/META-INF/*.kotlin_builtins'
        }
    }

    buildFeatures {
        viewBinding false
        buildConfig true
        compose false
        dataBinding false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'UnusedResources', 'UnusedIds', 'MissingTranslation', 'ExtraTranslation'
    }

    dexOptions {
        preDexLibraries true
        dexInProcess true
        javaMaxHeapSize "8g"
    }

    bundle {
        language {
            enableSplit true
        }
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
    }

    // APK 按架构独立打包（仅 assembleRelease 时生效），并额外生成包含所有架构的通用包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86'
            universalApk true
        }
    }
}

// 桌面路径：真实桌面可能不在 user.home（如用户目录被重定向到其他盘），按候选路径取第一个存在的
def desktopCandidates = [
        "${System.getenv('USERPROFILE')}\\Desktop",
        "${System.getProperty('user.home')}\\Desktop",
        "${System.getProperty('user.dir')}\\.."
]
def desktopPath = desktopCandidates.find { new File(it).exists() } ?: "${System.getProperty('user.home')}\\Desktop"
def apkOutputPath = "${projectDir}/build/outputs/apk/release"

task copyApkToDesktop {
    dependsOn 'assembleRelease'
    
    doLast {
        def desktopDir = new File(desktopPath)
        def apkDir = new File(apkOutputPath)
        
        if (!apkDir.exists()) {
            println "APK directory not found: ${apkDir.absolutePath}"
            return
        }
        
        apkDir.eachFileMatch(~/.*\.apk/) { apkFile ->
            def destFile = new File(desktopDir, apkFile.name)
            
            if (destFile.exists()) {
                println "Removing old APK: ${destFile.absolutePath}"
                destFile.delete()
            }
            
            println "Copying APK to desktop: ${apkFile.name}"
            destFile.withOutputStream { os ->
                apkFile.withInputStream { is ->
                    os << is
                }
            }
            
            println "APK copied successfully to: ${destFile.absolutePath}"
            
            println "Installing APK via ADB..."
            def adbCmd = "adb install -r ${destFile.absolutePath}"
            println "Executing: $adbCmd"
            def process = adbCmd.execute()
            process.in.eachLine { line -> println "ADB output: $line" }
            process.err.eachLine { line -> println "ADB error: $line" }
            process.waitFor()
            
            if (process.exitValue() == 0) {
                println "APK installed successfully!"
            } else {
                println "ADB install failed with exit code: ${process.exitValue()}"
            }
        }
    }
}

// 复制/安装 APK 是可选后处理：不阻塞 assembleRelease，需要时手动执行 gradlew copyApkToDesktop
// afterEvaluate {
//     assembleRelease.finalizedBy copyApkToDesktop
// }

dependencies {
    // Kotlin
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Hilt DI 已移除：BiliTerminalApp 从未被实例化，Manifest 的 Application 是 BiliTerminal，
    // Hilt 生成的组件在运行期完全用不到；ksp/serialization 插件也仅服务于这些死依赖。

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    // Glide annotation processor
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Existing essential deps
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Player & Danmaku
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')

    // 注：minSdk 24 下 ART 原生支持 multidex，androidx.multidex 与其 install() 调用均为死代码，已移除
    // 注：androidx.asynclayoutinflater、protobuf-javalite、geetest sensebot 全工程零引用，已移除

    // UETool (饿了么开源) UI 调试工具，仅 Debug 生效，release 用 no-op 空实现
    debugImplementation 'com.github.eleme.UETool:uetool:1.3.4'
    debugImplementation 'com.github.eleme.UETool:uetool-base:1.3.4'
    releaseImplementation 'com.github.eleme.UETool:uetool-no-op:1.3.4'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}

// ---------------------------------------------------------------------------
// 版本号一致性校验（见 docs/review/upstream-fork-audit.md §五 E1）
//
// versionName / versionCode 分散在多处，全靠人工同步，历史上已实际漂移过两次
//（readme badge 停在 26.09.07、docs/FEATURES.md 停在 26.08.14）：
//   1. 本文件 defaultConfig —— 唯一真正决定安装包版本的地方
//   2. app/src/main/res/values/strings.xml 的更新日志锚点「【<versionName> 本次更新】」—— 用户可见
//   3. 根目录 config.json —— 被 .gitignore 排除，随 APK 单独部署给更新检查接口
//
// 刻意不挂在 assemble 上：本地改完 build.gradle、还没同步文档时不该连编译都被挡住。
// 挂在 check 上，并由 CI 显式调用一次以便尽早失败。
tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = '校验 build.gradle / strings.xml / config.json 三处版本号是否一致'

    def expectName = android.defaultConfig.versionName
    def expectCode = android.defaultConfig.versionCode
    def stringsFile = file('src/main/res/values/strings.xml')
    def configFile = rootProject.file('config.json')

    // 显式声明输入，保证配置缓存命中时不会拿旧值
    inputs.property('versionName', expectName)
    inputs.property('versionCode', expectCode)
    inputs.file(stringsFile)
    if (configFile.exists()) {
        inputs.file(configFile)
    }

    doLast {
        def problems = []
        def anchor = "【${expectName} 本次更新】"

        // 2) 更新日志锚点：关于页的「本次更新」标题必须跟着版本号走
        if (!stringsFile.getText('UTF-8').contains(anchor)) {
            problems << "src/main/res/values/strings.xml 里找不到更新日志锚点「${anchor}」，请把当版更新说明的标题改成该字符串"
        }

        // 3) config.json：不存在时跳过（该文件被 .gitignore 排除，CI 上就没有）
        if (!configFile.exists()) {
            logger.lifecycle('verifyVersionConsistency：未找到 config.json（被 .gitignore 排除），跳过该项校验')
        } else {
            def cfg = new groovy.json.JsonSlurper().parse(configFile, 'UTF-8')
            if (cfg.versionCode?.toString() != expectCode.toString()) {
                problems << "config.json 的 versionCode=${cfg.versionCode} 与 build.gradle 的 ${expectCode} 不一致 —— 会把用户的更新提示指向错误的版本"
            }
            if (cfg.versionName?.toString() != expectName) {
                problems << "config.json 的 versionName=${cfg.versionName} 与 build.gradle 的 ${expectName} 不一致"
            }
            // forceUpdate 目前写成字符串 "false"。UpdateManager 已显式兼容字符串与布尔两种写法，
            // 这里只提示不报错，避免 CI 因一个不影响功能的写法整体变红。
            if (!(cfg.forceUpdate instanceof Boolean)) {
                logger.warn("verifyVersionConsistency：config.json 的 forceUpdate 应写成 JSON 布尔值（当前是 ${cfg.forceUpdate?.getClass()?.simpleName}）；UpdateManager 已兼容，建议后续纠正")
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException('版本号不一致：\n  - ' + problems.join('\n  - '))
        }
        logger.lifecycle("verifyVersionConsistency：版本号一致 versionName=${expectName} versionCode=${expectCode}")
    }
}

// 让 ./gradlew check 带上这项校验（check 由 Android 基础插件提供，这里用 matching 避免强依赖）
tasks.matching { it.name == 'check' }.configureEach { dependsOn 'verifyVersionConsistency' }