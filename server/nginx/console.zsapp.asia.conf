# RE:哔哩终端 控制台（WebUI）—— 遥测 / 反馈 / 崩溃 / 公告
#
# 独立域名 + 独立证书，和面向客户端的 rebiliterminal.zsapp.asia 分开：
#   * 客户端域名只反代 /terminal/ 与 /admin，避免把后台 UI 暴露在客户端入口上
#   * 控制台域名只反代后台，/terminal/ 直接 404，两边互不越界
#
# 证书由 acme.sh（webroot 模式）签发，不注册进宝塔站点表：
#   acme.sh --issue -d console.zsapp.asia --webroot /www/wwwroot/console.zsapp.asia --keylength ec-256
#
# 部署位置：/www/server/panel/vhost/nginx/console.zsapp.asia.conf
# 配套文件：/www/server/panel/vhost/nginx/well-known/console.zsapp.asia.conf

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name console.zsapp.asia;
    root /www/wwwroot/console.zsapp.asia;
    index index.html;

    access_log /www/wwwlogs/console.zsapp.asia.log;
    error_log /www/wwwlogs/console.zsapp.asia.error.log;

    # HTTP 跳 HTTPS（证书验证路径除外）
    set $is_redcert 1;
    if ($server_port != 443) { set $is_redcert 2; }
    if ($uri ~ /\.well-known/ ) { set $is_redcert 1; }
    if ($is_redcert != 1) { rewrite ^(/.*)$ https://$host$1 permanent; }

    ssl_certificate     /www/server/panel/vhost/cert/console.zsapp.asia/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/console.zsapp.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "no-referrer";
    # 页面零外部依赖（样式/脚本都是内联的），所以可以用很紧的 CSP
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'";

    location /.well-known/ {
        allow all;
    }

    # 客户端接口不在这个域名上开放
    location ^~ /terminal/ {
        return 404;
    }

    # 控制台本体：/ 是登录页或 WebUI，/console/* 是登录登出，/admin/api/* 是数据接口
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }
}
