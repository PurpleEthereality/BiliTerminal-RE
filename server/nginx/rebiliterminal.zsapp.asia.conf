server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name rebiliterminal.zsapp.asia;
    root /www/wwwroot/rebiliterminal.zsapp.asia;
    index index.html;

    access_log /www/wwwlogs/rebiliterminal.zsapp.asia.log;
    error_log /www/wwwlogs/rebiliterminal.zsapp.asia.error.log;

    # HTTP 跳 HTTPS（证书验证路径除外）
    set $is_redcert 1;
    if ($server_port != 443) { set $is_redcert 2; }
    if ($uri ~ /\.well-known/ ) { set $is_redcert 1; }
    if ($is_redcert != 1) { rewrite ^(/.*)$ https://$host$1 permanent; }

    ssl_certificate     /www/server/panel/vhost/cert/rebiliterminal.zsapp.asia/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/rebiliterminal.zsapp.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    location /.well-known/ {
        allow all;
    }

    # 接口反代到本机 FastAPI
    location ^~ /terminal/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }

    location = / {
        default_type text/plain;
        return 200 "RE:BiliTerminal backend is running.\n";
    }

    location / {
        return 404;
    }
}
