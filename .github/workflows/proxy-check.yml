name: 代理连通性自检（诊断用）

# 用途：Gitee 上传很慢，想走 Secrets.VLESS_PROXY_LINK 的代理，但先得确认
# "这个节点在 GitHub runner 上到底通不通"。本工作流只做只读诊断：
#   1) 打印 xray 客户端配置里的**非敏感**字段（地址/端口/传输/REALITY 参数，不含 uuid/pbk 明文）；
#   2) 直接测一条 TCP 到节点的连通性；
#   3) 用 debug 日志起 xray，再经 socks5 请求一个 URL，把 xray 的握手细节打出来。
on:
  workflow_dispatch:
    inputs:
      target:
        description: '经代理请求的目标 URL'
        required: false
        default: 'https://gitee.com/'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 xray 与配置（debug 日志）
        env:
          VLESS_LINK: ${{ secrets.VLESS_PROXY_LINK }}
          XRAY_LOGLEVEL: debug
        run: |
          if [ -z "$VLESS_LINK" ]; then
            echo "::error::没配 Secrets.VLESS_PROXY_LINK"
            exit 1
          fi
          mkdir -p proxy && cd proxy
          curl -sSL --retry 3 -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -oq xray.zip && chmod +x xray
          VLESS_LINK="$VLESS_LINK" OUT="$PWD/config.json" XRAY_LOGLEVEL=debug \
            python3 "$GITHUB_WORKSPACE/.github/scripts/make_xray_config.py"
          echo "--- 配置要点（不含 uuid / pbk 明文）---"
          python3 - <<'PY'
          import json
          d = json.load(open('config.json'))
          ob = d['outbounds'][0]
          vn = ob['settings']['vnext'][0]
          st = ob['streamSettings']
          print('节点      :', vn['address'] + ':' + str(vn['port']))
          print('network   :', st.get('network'), '| security:', st.get('security'))
          rs = st.get('realitySettings') or {}
          print('serverName:', rs.get('serverName'), '| fingerprint:', rs.get('fingerprint'))
          print('shortId   :', repr(rs.get('shortId')), '| spiderX:', repr(rs.get('spiderX')))
          print('pbk 长度  :', len(rs.get('publicKey') or ''), '| uuid 长度:', len(vn['users'][0].get('id') or ''))
          print('flow      :', vn['users'][0].get('flow'))
          print('socks 端口:', d['inbounds'][0]['port'])
          # 供后续步骤用的地址/端口
          open('node.txt', 'w').write(f"{vn['address']} {vn['port']}\n")
          PY

      - name: 直连节点 TCP 连通性
        run: |
          read -r HOST PORT < proxy/node.txt
          echo "测试 TCP $HOST:$PORT …"
          if timeout 12 bash -c "exec 3<>/dev/tcp/$HOST/$PORT"; then
            echo "TCP 可建立连接 ✅"
          else
            echo "::warning::TCP 连不上（节点不可达 / 被墙 / runner 出口被拒）❌"
          fi
          echo "--- 到节点的 TLS 握手（纯 TCP，不带任何伪装参数）---"
          timeout 15 openssl s_client -connect "$HOST:$PORT" -servername www.amazon.com </dev/null 2>&1 | head -20 || true

      - name: 经代理请求目标 URL
        env:
          TARGET: ${{ inputs.target }}
        run: |
          cd proxy
          nohup ./xray run -c config.json > xray.log 2>&1 &
          sleep 6
          echo "--- 经 socks5 请求 $TARGET ---"
          curl -sS -o /dev/null -w "HTTP %{http_code} 用时%{time_total}s\n" \
            --max-time 40 --proxy socks5h://127.0.0.1:10808 "$TARGET" || echo "（经代理请求失败）"
          echo
          echo "--- xray.log（debug）---"
          tail -60 xray.log
