name: CI 编译与单测自检

# 触发方式：
# 1) 向 main 提 PR：编译 + 单测自检（此前任何 PR 都不会被编译，见 docs/review/upstream-fork-audit.md §五 E3）
# 2) push 到 main：同上，防止直接推 main 引入编译不过的提交
# 3) 手工触发（workflow_dispatch）
#
# 发版流程（tag -> Release）在 build-release.yml，与本文件互不重叠：本文件不监听 tag。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的旧运行没有价值，直接取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      # 与 build-release.yml 保持同一套清理逻辑：
      # gradle.properties 硬编码了本机 Windows JDK 路径与本地代理（Clash），
      # Linux CI 必须移除，否则会拿不存在的 JDK 路径启动 daemon、并通过本地代理拉依赖失败。
      # 同时把 Gradle/Kotlin daemon 堆内存调低，避免在 GitHub 较小内存的 runner 上 OOM。
      - name: 适配 Linux 构建环境
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i -E '/^systemProp\.(http|https)\.(proxyHost|proxyPort)=/d' gradle.properties
          sed -i 's/org.gradle.jvmargs=-Xmx4096m/org.gradle.jvmargs=-Xmx2048m/' gradle.properties || true
          sed -i 's/kotlin.daemon.jvmargs=-Xmx8192m/kotlin.daemon.jvmargs=-Xmx2048m/' gradle.properties || true
          if grep -nE 'java.home|proxyHost|proxyPort' gradle.properties; then
            echo "::error::gradle.properties 仍残留本机配置，请检查"
            exit 1
          fi
          echo "gradle.properties 已清理"

      # 显式关掉配置缓存：CI 只跑一次构建，缓存收益为负，而且配置缓存会把
      # 上一次构建的输入快照写进 build/ 目录，出问题时排查成本高于收益。
      - name: 编译 Debug 包
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      # 112 个单测此前不在任何自动化路径执行，测试全红也能发版（见 §五 E3）
      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache --stacktrace

      # 单测失败时也要把报告传上来，否则只能看到一行 FAILED
      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
